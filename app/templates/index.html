<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Конвертер валют</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <style>
        .text-gold { color: #FFD700 !important; }

        .btn-gold {
            background-color: #FFD700;
            color: #000000;
            font-weight: bold;
            border: none;
        }
        .btn-gold:hover {
            background-color: #E6C200;
            color: #000000;
        }

        .navbar-brand {
            font-size: 1.8rem !important;
        }

        .swap-btn {
            width: 50px;
            height: 50px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .swap-btn:hover {
            background-color: #FFD700;
            color: #000;
            border-color: #FFD700;
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="bg-light">


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-gold" href="#">
            <i class="bi bi-currency-exchange me-2"></i>CurrencyApp
        </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Конвертер</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <h1 class="mb-4 text-center fw-light">Конвертер <span class="fw-bold text-gold">валют</span></h1>


                {% if rates %}
                <div class="row g-3 mb-4 text-center">
                    {% for code, rate in rates.items() %}
                        {% if code in ['USD', 'EUR', 'CNY'] %}
                        <div class="col-6 col-md-4">
                            <div class="card border-0 shadow-sm h-100">
                                <div class="card-body">
                                    <h6 class="text-muted mb-1">{{ code }} / RUB</h6>
                                    <h4 class="mb-0 fw-bold text-gold">{{ "%.2f"|format(rate) }} <small class="text-muted fs-6">₽</small></h4>
                                </div>
                            </div>
                        </div>
                        {% endif %}
                    {% endfor %}
                </div>
                {% endif %}

                <div class="card border-0 shadow-lg">
                    <div class="card-body p-4 p-md-5">

                        <div id="alertContainer" class="d-none"></div>

                        <form id="convertForm">
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <div class="form-floating">
                                        <input type="number" class="form-control form-control-lg" id="amount" placeholder="1000" required min="0.01" step="0.01">
                                        <label for="amount">Сумма</label>
                                    </div>
                                </div>

                                <div class="col-md-5">
                                    <div class="form-floating">
                                        <select class="form-select form-select-lg" id="fromCurrency">
                                            <option value="USD">USD - Доллар США</option>
                                            <option value="EUR">EUR - Евро</option>
                                            <option value="RUB" selected>RUB - Российский рубль</option>
                                        </select>
                                        <label for="fromCurrency">Из валюты</label>
                                    </div>
                                </div>

                                <div class="col-md-2 d-flex align-items-center justify-content-center">
                                    <button type="button" class="btn btn-outline-secondary rounded-circle swap-btn" id="swapBtn" title="Поменять местами">
                                        <i class="bi bi-arrow-left-right fs-5"></i>
                                    </button>
                                </div>

                                <div class="col-md-5">
                                    <div class="form-floating">
                                        <select class="form-select form-select-lg" id="toCurrency">
                                            <option value="USD" selected>USD - Доллар США</option>
                                            <option value="EUR">EUR - Евро</option>
                                            <option value="RUB">RUB - Российский рубль</option>
                                        </select>
                                        <label for="toCurrency">В валюту</label>
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-gold btn-lg" id="convertBtn">
                                    <span id="btnText">Конвертировать</span>
                                    <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
                                </button>
                            </div>
                        </form>

                        <div id="resultContainer" class="mt-4 text-center d-none">
                            <hr>
                            <p class="text-muted mb-1" id="resultText">1000 USD =</p>
                            <h2 class="display-4 fw-bold text-success" id="resultAmount">0.00 RUB</h2>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('convertForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const amount = document.getElementById('amount').value;
            const fromCurrency = document.getElementById('fromCurrency').value;
            const toCurrency = document.getElementById('toCurrency').value;

            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');
            const resultContainer = document.getElementById('resultContainer');
            const alertContainer = document.getElementById('alertContainer');

            btnSpinner.classList.remove('d-none');
            btnText.textContent = 'Загрузка...';
            alertContainer.classList.add('d-none');
            resultContainer.classList.add('d-none');

            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: parseFloat(amount),
                        from_currency: fromCurrency,
                        to_currency: toCurrency
                    })
                });

                if (!response.ok) throw new Error('Ошибка сервера');

                const data = await response.json();

                document.getElementById('resultText').textContent = `${amount} ${fromCurrency} =`;
                document.getElementById('resultAmount').textContent = `${data.result.toFixed(2)} ${toCurrency}`;
                resultContainer.classList.remove('d-none');

            } catch (error) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle me-2"></i> Не удалось выполнить конвертацию. Попробуйте позже.
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                `;
                alertContainer.classList.remove('d-none');
            } finally {
                btnSpinner.classList.add('d-none');
                btnText.textContent = 'Конвертировать';
            }
        });

        document.getElementById('swapBtn').addEventListener('click', () => {
            const fromSelect = document.getElementById('fromCurrency');
            const toSelect = document.getElementById('toCurrency');
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
        });
    </script>
</body>
</html>
